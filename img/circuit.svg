<svg width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bg-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bg-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bg-chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051336"/>
      <stop offset="100%" stop-color="#010042"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#010042" />

  <!-- Circuit Trace Tracks -->
  <g stroke="rgba(0, 132, 245, 0.25)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0,200 L 250,200 L 350,300 L 550,300 L 630,220 L 850,220" />
    <path d="M 0,450 L 180,450 L 280,350 L 500,350 L 580,430 L 760,430" />
    <path d="M 0,700 L 220,700 L 320,600 L 580,600 L 650,680 L 820,680" />
    <path d="M 0,900 L 300,900 L 420,780 L 640,780 L 720,860 L 900,860" />

    <path d="M 1920,200 L 1670,200 L 1570,300 L 1370,300 L 1290,220 L 1070,220" />
    <path d="M 1920,450 L 1740,450 L 1640,350 L 1420,350 L 1340,430 L 1160,430" />
    <path d="M 1920,700 L 1700,700 L 1600,600 L 1340,600 L 1270,680 L 1100,680" />
    <path d="M 1920,900 L 1620,900 L 1500,780 L 1280,780 L 1200,860 L 1020,860" />

    <!-- Vertical Lines -->
    <path d="M 400,0 L 400,150 L 480,230 L 480,380" />
    <path d="M 750,0 L 750,120 L 830,200 L 830,320" />
    <path d="M 1170,0 L 1170,120 L 1090,200 L 1090,320" />
    <path d="M 1520,0 L 1520,150 L 1440,230 L 1440,380" />

    <path d="M 450,1080 L 450,920 L 530,840 L 530,720" />
    <path d="M 1470,1080 L 1470,920 L 1390,840 L 1390,720" />
  </g>

  <!-- Glowing Active Lines -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#23F8B2" stroke-width="2.5" filter="url(#bg-glow-green)" d="M 50,200 L 250,200 L 350,300 L 550,300 L 630,220 L 850,220" />
    <path stroke="#0084F5" stroke-width="2.5" filter="url(#bg-glow-cyan)" d="M 1870,200 L 1670,200 L 1570,300 L 1370,300 L 1290,220 L 1070,220" />
    <path stroke="#0084F5" stroke-width="2" filter="url(#bg-glow-cyan)" d="M 0,450 L 180,450 L 280,350 L 500,350 L 580,430 L 760,430" />
    <path stroke="#23F8B2" stroke-width="2" filter="url(#bg-glow-green)" d="M 1920,450 L 1740,450 L 1640,350 L 1420,350 L 1340,430 L 1160,430" />
  </g>

  <!-- Chips -->
  <g transform="translate(300, 160)">
    <rect x="0" y="0" width="80" height="70" rx="5" fill="url(#bg-chip-grad)" stroke="#0084F5" stroke-width="1.5" filter="url(#bg-glow-cyan)"/>
    <text x="40" y="40" text-anchor="middle" fill="#23F8B2" font-size="10" font-family="monospace">EDUMAKER</text>
  </g>

  <g transform="translate(1540, 160)">
    <rect x="0" y="0" width="80" height="70" rx="5" fill="url(#bg-chip-grad)" stroke="#23F8B2" stroke-width="1.5" filter="url(#bg-glow-green)"/>
    <text x="40" y="40" text-anchor="middle" fill="#0084F5" font-size="10" font-family="monospace">FAB LAB</text>
  </g>

  <!-- Junction Nodes -->
  <circle cx="250" cy="200" r="5" fill="#23F8B2" filter="url(#bg-glow-green)"/>
  <circle cx="350" cy="300" r="5" fill="#23F8B2" filter="url(#bg-glow-green)"/>
  <circle cx="550" cy="300" r="5" fill="#23F8B2" filter="url(#bg-glow-green)"/>
  <circle cx="1670" cy="200" r="5" fill="#0084F5" filter="url(#bg-glow-cyan)"/>
  <circle cx="1570" cy="300" r="5" fill="#0084F5" filter="url(#bg-glow-cyan)"/>
  <circle cx="1370" cy="300" r="5" fill="#0084F5" filter="url(#bg-glow-cyan)"/>
</svg>